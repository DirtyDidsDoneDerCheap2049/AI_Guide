[project]
name = "ai-guide-backend"
version = "0.1.0"
description = "AI-Guide v0.1 后端：FastAPI + MySQL + Redis/Dramatiq + SSE + 受控 Agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: 需要真实 MySQL 与 Redis",
    "fixture_provider: 使用 fixture Provider，仅用于自动回归",
]

[tool.ruff]
line-length = 120
target-version = "py311"

  <text x="164" y="114" fill="#263e35" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">Tripwright</text>
  <text x="78" y="218" fill="#263e35" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="46" font-weight="600">把想去的地方，安排成一次旅行。</text>
  <text x="80" y="274" fill="#62736a" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24">对话里讨论，地图上安排，下次打开接着计划。</text>
  <text x="80" y="355" fill="#50765c" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="2">TRAVEL PLANNING AGENT · SELF-HOSTED · OPEN SOURCE</text>

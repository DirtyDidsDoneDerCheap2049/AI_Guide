# AI-Guide v0.1 生产 Compose：web / api / worker / mysql / redis + 一次性 migrate
#
# 安装与更新：docs/DEPLOYMENT.md；数据流：docs/ARCHITECTURE.md。
#
# 约定（不要绕过）：
#   1. 只有 web 发布端口；api / worker / mysql / redis / migrate 只在 Compose 网络内通信。
#   2. 所有 image 固定 tag，禁止 latest；后端与前端镜像 tag 都由 .env 的 APP_VERSION 决定。
#   3. MySQL 是唯一事实来源；Redis 只承载 Dramatiq 队列，不能当作业务数据恢复来源。
#   4. 服务器上的 .env 只保存在服务器，不进 Git（模板见 deploy/.env.production.example）。
#   5. 表结构只由 Alembic 迁移维护，应用启动不会自动建表。
#
# 镜像名约定（与 .github/workflows/ci.yml 中发布的 GHCR 镜像一致）：
#   ${IMAGE_REGISTRY}/ai-guide-api:${APP_VERSION}   api / worker / migrate 共用
#   ${IMAGE_REGISTRY}/ai-guide-web:${APP_VERSION}   web（web/Dockerfile 由前端工作台任务提供）

name: ai-guide

# 后端三个服务（api / worker / migrate）共享的环境注入。
# env_file 把服务器 .env 的全部变量注入容器；environment 只覆盖容器内必须固定的项。
x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:?APP_ENV 必须在 .env 中显式设置}
    APP_VERSION: ${APP_VERSION:?APP_VERSION 必须在 .env 中显式设置为发布标签}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必须在 .env 中显式设置}
    REDIS_URL: ${REDIS_URL:?REDIS_URL 必须在 .env 中显式设置}
    REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-ai_guide_runs}
    SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 必须在 .env 中显式设置}
    SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ai_guide_session}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
    PROVIDER_MODE: ${PROVIDER_MODE:?PROVIDER_MODE 必须在 .env 中显式设置，生产必须为 real}
    # 容器内的媒体目录固定为命名卷挂载点，避免 .env 里的本机相对路径被带进容器。
    MEDIA_ROOT: /var/lib/ai-guide/media
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    WORKER_RECOVERY_INTERVAL_SECONDS: ${WORKER_RECOVERY_INTERVAL_SECONDS:-60}
  volumes:
    - media-data:/var/lib/ai-guide/media
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------- 基础设施
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 必须在 .env 中显式设置}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 必须在 .env 中显式设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须在 .env 中显式设置}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中显式设置}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # AOF 打开：Broker 重启后队列中的待处理消息不会丢。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- 一次性迁移
  # 必须在 api / worker 之前成功退出；失败时 api 与 worker 不会启动。
  migrate:
    <<: *backend-env
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 必须在 .env 中显式设置}/ai-guide-api:${APP_VERSION:?APP_VERSION 必须在 .env 中显式设置为发布标签}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  # ---------------------------------------------------------------- 应用
  api:
    <<: *backend-env
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 必须在 .env 中显式设置}/ai-guide-api:${APP_VERSION:?APP_VERSION 必须在 .env 中显式设置为发布标签}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/health/ready 会真实检查 MySQL 连接、Alembic 版本是否为 head、Redis 连接。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend-env
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 必须在 .env 中显式设置}/ai-guide-api:${APP_VERSION:?APP_VERSION 必须在 .env 中显式设置为发布标签}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 与 api 同镜像、不同启动命令；Worker 不发布任何端口。
    command: ["python", "-m", "app.worker.cli", "worker", "--processes", "2", "--threads", "4"]

  # ---------------------------------------------------------------- 入口
  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 必须在 .env 中显式设置}/ai-guide-web:${APP_VERSION:?APP_VERSION 必须在 .env 中显式设置为发布标签}
    build:
      context: ./web
      args:
        # 高德网页端 JS Key 在构建期注入 Vite；未设置时镜像仍可构建，地图显示"未配置地图 Key"
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 站点地址：域名（Caddy 自动 HTTPS）或 ":80"（外层网关终止 TLS）。
      # 由 deploy/.env 显式选择；默认 ":80" 表示"我确认外层已终止 TLS"。
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # 唯一对外的端口映射：Caddy 提供静态文件并反向代理 /api/* 到 api:8000。
    # 443 仅在 SITE_ADDRESS 是域名（Caddy 自己终止 TLS）时需要；
    # WEB_HTTPS_PORT 置空可以完全关闭该映射（Compose 会忽略空值端口）。
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # 证书与 ACME 账号必须持久化，否则每次重启都重新申请证书（会触发速率限制）。
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        # 等 api 的 /api/health/ready 通过再开放入口，避免页面拿到 502。
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
  media-data:
  caddy-data:
  caddy-config:

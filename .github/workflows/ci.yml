name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/secret_scan.py --tracked --fail-on-credentials --quiet
      - run: python deploy/check-env-parity.py
      - run: bash deploy/check-compose.sh

  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder-password
          MYSQL_DATABASE: ai_guide_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=3s --health-retries=10
    env:
      # These credentials exist only in disposable CI containers.
      AI_GUIDE_TEST_DATABASE_URL: mysql+pymysql://root:ci-placeholder-password@127.0.0.1:3306/ai_guide_test?charset=utf8mb4
      AI_GUIDE_TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: python -m pytest -q -W error::pytest.PytestUnhandledThreadExceptionWarning

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web

  compose-e2e:
    needs: [repository-checks, backend-tests, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CI has no production credentials and never publishes images or deploys.
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated fixture configuration
        run: python3 scripts/prepare_ci_env.py
      - name: Validate and build
        run: |
          docker compose -f docker-compose.yml -f deploy/compose.small.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.small.yml build api web
          docker compose -f docker-compose.yml -f deploy/compose.small.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/health/ready >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Worker success path (fixture)
        run: python3 backend/scripts/compose_smoke.py --base-url http://127.0.0.1:8080 --expect WAITING_USER --timeout 90
      - name: Worker failure path (injected timeout)
        run: |
          printf '\nFIXTURE_BEHAVIORS=vision=timeout\n' >> .env
          docker compose -f docker-compose.yml -f deploy/compose.small.yml up -d --no-deps --force-recreate worker
          python3 backend/scripts/compose_smoke.py --base-url http://127.0.0.1:8080 --expect FAILED --timeout 90
      - name: Restart and health check
        run: |
          docker compose -f docker-compose.yml -f deploy/compose.small.yml restart worker
          curl -fsS --max-time 10 http://127.0.0.1:8080/api/health/ready
      - name: Backup and restore disposable CI data
        env:
          COMPOSE_OVERRIDE_FILE: deploy/compose.small.yml
        run: |
          bash deploy/backup.sh
          MYSQL_FILE="$(ls -1t backups/mysql-*.sql.gz | head -n1)"
          MEDIA_FILE="$(ls -1t backups/media-*.tar.gz | head -n1)"
          MANIFEST_FILE="$(ls -1t backups/manifest-*.json | head -n1)"
          bash deploy/restore.sh --mysql "$MYSQL_FILE" --media "$MEDIA_FILE" --manifest "$MANIFEST_FILE" --yes
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/health/ready >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Diagnostics on failure (CI data only)
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/compose.small.yml logs --tail=100
      - name: Remove disposable CI resources
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/compose.small.yml down -v
